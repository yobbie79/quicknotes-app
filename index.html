```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>A simple place to write and organise your notes.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a Note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Your note</label>
                    <input
                        type="text"
                        id="note-input"
                        placeholder="Write your note here..."
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Choose a category</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section id="your-notes-section">
            <h2>Your Notes</h2>

            <div class="form-group">
                <label for="search-input">Search your notes</label>
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search by note text..."
                >
            </div>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes App | Web Foundations Project 1</p>
    </footer>
</body>
</html>
```
